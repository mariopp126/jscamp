name: 01 - Hello

on:
    push:
        branches: [master]

jobs:
    hello:
        runs-on: ubuntu-24.04
        steps:
            - name: Saludar
              run: echo "Hola desde Github Actions!"
            
            - name: Ver fecha del runner
              run: date
            
            - name: Ver archivos disponibles
              run: ls -la

    repo-files: 
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repo
              uses: actions/checkout@v6
            
            - name: Ver archivos del repositorio
              run: ls -la