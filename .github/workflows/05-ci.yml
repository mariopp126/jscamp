name: 05 - CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend-lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 09-ci-cd
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm and node.js for CI/CD
        uses: ./.github/actions/setup-pnpm-ci-cd

      - name: Lint
        run: |
          echo "::group::Linting frontend"
          pnpm lint:frontend
          echo "::endgroup::"

  frontend-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 09-ci-cd
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm and node.js for CI/CD
        uses: ./.github/actions/setup-pnpm-ci-cd

  backend-lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 09-ci-cd
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm and node.js for CI/CD
        uses: ./.github/actions/setup-pnpm-ci-cd

      - name: Lint
        run: pnpm lint:backend

  backend-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 09-ci-cd
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm and node.js for CI/CD
        uses: ./.github/actions/setup-pnpm-ci-cd

      - name: Test
        run: pnpm test:backend